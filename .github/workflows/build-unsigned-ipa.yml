name: Build Unsigned IPA

on:
  workflow_dispatch:   # Actionsタブから手動実行できるようにする
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show available schemes
        run: xcodebuild -project Moonlight.xcodeproj -list
        
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: Sync new source files into Xcode project
        run: ruby Scripts/sync_xcode_sources.rb
        
      - name: Archive (no code signing)
        run: |
          xcodebuild archive \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -sdk iphoneos \
            -archivePath $PWD/build/Moonlight.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            IPHONEOS_DEPLOYMENT_TARGET=14.0

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Moonlight.xcarchive/Products/Applications/*.app Payload/
          zip -r Moonlight-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: Moonlight-unsigned.ipa
